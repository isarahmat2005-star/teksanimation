<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Microstock Metadata Injector</title>
  <style>
    :root {
      --bg-main: #121214;
      --bg-card: #1a1a1e;
      --accent: #00bcd4;
      --text: #e1e1e6;
      --border: #29292e;
    }
    body {
      background-color: var(--bg-main);
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0; padding: 20px;
    }
    .container { max-width: 700px; margin: 0 auto; }
    .form-group {
      background: var(--bg-card);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 15px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .btn {
      background: var(--border);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 15px; border-radius: 6px; cursor: pointer;
    }
    .btn:hover { border-color: var(--accent); }
    .btn-main {
      background: var(--accent); color: #000; font-weight: bold;
      width: 100%; padding: 15px; font-size: 16px; margin-top: 10px;
    }
    .path-display { font-size: 13px; color: #8d8d99; max-width: 70%; overflow: hidden; text-overflow: ellipsis; }
    .checkbox-container { margin: 15px 5px; display: flex; align-items: center; gap: 10px; }
    
    /* Panel Log Terminal */
    .log-panel {
      background: #09090a; border: 1px solid var(--border);
      border-radius: 6px; height: 180px; padding: 10px;
      font-family: 'Courier New', Courier, monospace; font-size: 12px;
      overflow-y: auto; color: #a8a8b3; margin-top: 15px;
    }
    .log-entry.success { color: #04d361; }
    .log-entry.error { color: #f75a68; }
  </style>
</head>
<body>

<div class="container">
  <h2>Microstock Metadata Injector</h2>
  
  <!-- Folder Asal -->
  <div class="form-group">
    <button class="btn" id="btn-source">Pilih Folder Asal</button>
    <div class="path-display" id="source-path">Belum ada folder terpilih...</div>
  </div>

  <!-- Folder Tujuan -->
  <div class="form-group">
    <button class="btn" id="btn-target">Pilih Folder Tujuan</button>
    <div class="path-display" id="target-path">Belum ada folder terpilih...</div>
  </div>

  <!-- File CSV -->
  <div class="form-group">
    <button class="btn" id="btn-csv">Upload File CSV</button>
    <div class="path-display" id="csv-path">Belum ada file CSV terpilih...</div>
  </div>

  <!-- Checkbox Hapus Asal -->
  <div class="checkbox-container">
    <input type="checkbox" id="chk-delete-source" style="transform: scale(1.2);">
    <label for="chk-delete-source">Hapus file di folder asal setelah sukses di-inject</label>
  </div>

  <!-- Tombol Eksekusi -->
  <button class="btn btn-main" id="btn-start">MULAI PROSES INJEKSI</button>

  <!-- Log Window -->
  <div class="log-panel" id="log-window">
    <div class="log-entry">[System] Aplikasi siap digunakan.</div>
  </div>
</div>

<script>
  // Logika UI handling (fungsi append log tanpa menimbun memori)
  const logWindow = document.getElementById('log-window');
  
  function addLog(text, type = 'info') {
    const entry = document.createElement('div');
    entry.className = `log-entry ${type}`;
    entry.innerText = `[${new Date().toLocaleTimeString()}] ${text}`;
    logWindow.appendChild(entry);
    
    // Batasi log di UI hanya 150 baris terakhir agar DOM tidak berat/lag
    if (logWindow.children.length > 150) {
      logWindow.removeChild(logWindow.firstChild);
    }
    
    // Auto scroll ke bawah
    logWindow.scrollTop = logWindow.scrollHeight;
  }
</script>
</body>
</html>
