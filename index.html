<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metadata Injector</title>
  <style>
    :root {
      --bg-main: #f1f5f9;
      --bg-card: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --success: #16a34a;
      --error: #dc2626;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: var(--bg-card);
      width: 100%;
      max-width: 650px;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(0, 0, 0, 0.04);
    }

    .header {
      margin-bottom: 28px;
      text-align: center;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 6px;
    }

    .header p {
      font-size: 14px;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .input-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn-browse {
      background-color: #ffffff;
      color: var(--primary);
      border: 1px solid var(--primary);
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-browse:hover {
      background-color: #eff6ff;
    }

    .path-display {
      flex: 1;
      background-color: #f8fafc;
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 24px 0;
      padding: 14px;
      background-color: #f8fafc;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }

    .checkbox-container input {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .checkbox-container label {
      font-size: 14px;
      color: var(--text-main);
      cursor: pointer;
      user-select: none;
    }

    .btn-main {
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
    }

    .btn-main:hover {
      background-color: var(--primary-hover);
    }

    .log-section {
      margin-top: 28px;
    }

    .log-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .log-panel {
      background: #0f172a;
      border-radius: 8px;
      height: 180px;
      padding: 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Courier New", monospace;
      font-size: 12px;
      overflow-y: auto;
      color: #94a3b8;
      line-height: 1.6;
    }

    .log-entry {
      margin-bottom: 4px;
    }

    .log-entry.success { color: #4ade80; }
    .log-entry.error { color: #f87171; }
    .log-entry.info { color: #38bdf8; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Microstock Injector</h1>
    <p>Suntik Metadata Gambar & Vektor via Lokal Berbasis JSON</p>
  </div>
  
  <div class="form-group">
    <label class="form-label">Folder Asal</label>
    <div class="input-row">
      <button class="btn-browse" id="btn-source">Pilih Folder</button>
      <div class="path-display" id="source-path">Belum ada folder asal terpilih...</div>
    </div>
  </div>

  <div class="form-group">
    <label class="form-label">Folder Tujuan</label>
    <div class="input-row">
      <button class="btn-browse" id="btn-target">Pilih Folder</button>
      <div class="path-display" id="target-path">Belum ada folder tujuan terpilih...</div>
    </div>
  </div>

  <div class="form-group">
    <label class="form-label">File Metadata (JSON)</label>
    <div class="input-row">
      <button class="btn-browse" id="btn-json">Upload JSON</button>
      <div class="path-display" id="json-path">Belum ada file JSON terpilih...</div>
    </div>
  </div>

  <div class="checkbox-container">
    <input type="checkbox" id="chk-delete-source">
    <label for="chk-delete-source">Hapus file di folder asal setelah sukses di-inject</label>
  </div>

  <button class="btn-main" id="btn-start">MULAI PROSES INJEKSI</button>

  <div class="log-section">
    <div class="log-title">Aktivitas Proses</div>
    <div class="log-panel" id="log-window">
      <div class="log-entry">[System] Aplikasi siap digunakan.</div>
    </div>
  </div>
</div>

<script>
  // Cek apakah berjalan di dalam Electron atau Browser biasa (Vercel)
  const isElectron = typeof window !== 'undefined' && window.process && window.process.type;
  const ipcRenderer = isElectron ? window.require('electron').ipcRenderer : null;

  const btnSource = document.getElementById('btn-source');
  const btnTarget = document.getElementById('btn-target');
  const btnJson = document.getElementById('btn-json');
  const btnStart = document.getElementById('btn-start');

  const sourcePath = document.getElementById('source-path');
  const targetPath = document.getElementById('target-path');
  const jsonPath = document.getElementById('json-path');
  const chkDeleteSource = document.getElementById('chk-delete-source');
  const logWindow = document.getElementById('log-window');

  let paths = { sourceDir: null, targetDir: null, jsonPath: null };

  function addLog(text, type = 'info') {
    const entry = document.createElement('div');
    entry.className = `log-entry ${type}`;
    entry.innerText = `[${new Date().toLocaleTimeString()}] ${text}`;
    logWindow.appendChild(entry);
    
    if (logWindow.children.length > 100) {
      logWindow.removeChild(logWindow.firstChild);
    }
    logWindow.scrollTop = logWindow.scrollHeight;
  }

  if (ipcRenderer) {
    // Jalur Logika Electron (Aplikasi Desktop Asli)
    btnSource.addEventListener('click', async () => {
      const path = await ipcRenderer.invoke('browse-folder');
      if (path) { paths.sourceDir = path; sourcePath.innerText = path; }
    });

    btnTarget.addEventListener('click', async () => {
      const path = await ipcRenderer.invoke('browse-folder');
      if (path) { paths.targetDir = path; targetPath.innerText = path; }
    });

    btnJson.addEventListener('click', async () => {
      const path = await ipcRenderer.invoke('browse-json');
      if (path) { paths.jsonPath = path; jsonPath.innerText = path; }
    });

    btnStart.addEventListener('click', () => {
      ipcRenderer.send('execute-injection', {
        ...paths,
        deleteOriginal: chkDeleteSource.checked
      });
    });

    ipcRenderer.on('log-to-ui', (event, text, type) => {
      addLog(text, type);
    });
  } else {
    // Jalur Logika Web Preview (Vercel Simulation Mode)
    console.log("Menjalankan mode simulasi web (Vercel Preview).");
    
    const setupMockBrowse = (btn, display, label) => {
      btn.addEventListener('click', () => {
        const dummy = label === 'JSON' ? 'C:\\Downloads\\metadata.json' : `C:\\Microstock\\${label}`;
        if(label === 'JSON') paths.jsonPath = dummy;
        else if(btn === btnSource) paths.sourceDir = dummy;
        else paths.targetDir = dummy;
        display.innerText = dummy;
        addLog(`Simulasi: Memilih ${label}`, 'info');
      });
    };

    setupMockBrowse(btnSource, sourcePath, 'Folder_Asal');
    setupMockBrowse(btnTarget, targetPath, 'Folder_Tujuan');
    setupMockBrowse(btnJson, jsonPath, 'JSON');

    btnStart.addEventListener('click', () => {
      addLog('Memulai simulasi sistem...', 'info');
      addLog('Peringatan: Untuk memproses file lokal, aplikasi harus dijalankan dalam mode desktop (.exe).', 'error');
    });
  }
</script>
</body>
</html>
